services:
  ai-backend:
    build: .
    container_name: ai-backend

    ports:
      - "5000:5000"

    networks:
      - network-sentinel

    environment:
      LOKI_TENANT_ID: ${LOKI_TENANT_ID}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}

    volumes:
      - ai-cache-data:/app/data

    restart: unless-stopped

networks:
  network-sentinel:
    external: true

volumes:
  ai-cache-data:
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Network Sentinel - Login</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<div class="container login-container">

    <header>

        <img
            src="/static/images/Network-Sentinel-Logo.png"
            alt="Network Sentinel Logo"
            class="logo"
        >

        <h1>Network Sentinel</h1>

        <p>
            Secure Customer Portal
        </p>

    </header>


    <section class="card login-card">

        <p class="eyebrow">
            CUSTOMER ACCESS
        </p>

        <h2>Sign In</h2>

        <p>
            Sign in to view your Network Sentinel security monitoring portal.
        </p>


        {% if error %}

        <div class="login-error">
            {{ error }}
        </div>

        {% endif %}


        <form method="POST" action="/login">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                autocomplete="username"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                autocomplete="current-password"
                required
            >


            <button
                type="submit"
                class="button login-button"
            >
                Sign In
            </button>

        </form>

    </section>

</div>

</body>

</html>

services:
  loki:
    image: grafana/loki:2.9.8
    container_name: loki
    restart: unless-stopped

    ports:
      - "3100:3100"

    command: -config.file=/etc/loki/local-config.yaml

    volumes:
      - ./configs/loki:/etc/loki
      - loki-data:/tmp/loki

    networks:
      - network-sentinel

  promtail:
    image: grafana/promtail:2.9.8
    container_name: promtail
    restart: unless-stopped

    command: -config.file=/etc/promtail/config.yml

    volumes:
      - ./configs/promtail:/etc/promtail
      - /home/daw/Network-Sentinel/Docker/suricata/logs:/var/log/suricata:ro

    depends_on:
      - loki

    networks:
      - network-sentinel

volumes:
  loki-data:

networks:
  network-sentinel:
    external: true
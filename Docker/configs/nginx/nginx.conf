events {}

http {
    server {
        listen 8080;

        client_max_body_size 10m;

        location = /health {
            default_type text/plain;
            return 200 "ok\n";
        }

        location /loki/api/v1/push {
            proxy_pass http://loki:3100;

            proxy_http_version 1.1;
            proxy_set_header Host $host;

            # Customer 001 tenant identity is assigned by the gateway.
            proxy_set_header X-Scope-OrgID "NS-C001";
        }
    }
}